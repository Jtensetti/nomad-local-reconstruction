name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  # A superseded run tells nobody anything: it is testing a candidate that has
  # already been replaced, while consuming a runner the new candidate needs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.25.x'
      - name: Verify formatting
        run: |
          # This package is vendored into nomad-testnet and Nomad-browser,
          # where a formatting difference shows up as spurious divergence
          # between the copy that ships and the copy that is developed.
          unformatted="$(gofmt -l .)"
          if test -n "$unformatted"; then
            printf 'unformatted Go files:\n%s\n' "$unformatted"
            gofmt -d .
            exit 1
          fi
      - run: go test -race ./...
      - run: go vet ./...
      - name: Verify the vulnerability gate still fails closed
        run: ./scripts/test-scan-vulnerabilities.sh
      - name: Scan dependencies for reachable vulnerabilities
        run: |
          # A vulnerability gate in one repository is a gate on one
          # repository. This ran only in Nomad-browser, leaving the
          # integration root and the cryptographic core unscanned.
          ./scripts/scan-vulnerabilities.sh
