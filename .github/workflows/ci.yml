name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - name: Verify formatting
        run: |
          # This package is vendored into nomad-testnet and Nomad-browser,
          # where a formatting difference shows up as spurious divergence
          # between the copy that ships and the copy that is developed.
          unformatted="$(gofmt -l .)"
          if test -n "$unformatted"; then
            printf 'unformatted Go files:\n%s\n' "$unformatted"
            gofmt -d .
            exit 1
          fi
      - run: go test -race ./...
      - run: go vet ./...
      - name: Scan dependencies for reachable vulnerabilities
        run: |
          # A vulnerability gate in one repository is a gate on one
          # repository. This ran only in Nomad-browser, leaving the
          # integration root and the cryptographic core unscanned.
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
